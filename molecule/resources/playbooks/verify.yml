---
# role: hostname
# file: molecule/resources/playbooks/verify.yml

- name: "HOSTNAME | Verify the container hostname is preserved"
  hosts: all
  gather_facts: false
  tasks:
    - name: "HOSTNAME | Read the system hostname using the installed utility"
      ansible.builtin.command: hostname
      changed_when: false
      register: __hostname_current

    - name: "HOSTNAME | Verify the runtime-assigned hostname remains unchanged"
      ansible.builtin.assert:
        that:
          - __hostname_current.stdout == inventory_hostname
          - __hostname_current.stdout != hostname_name
        quiet: true
